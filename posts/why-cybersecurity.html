      <h1>我为什么开始学网络安全</h1>
      <div class="meta">2026-11-04</div>
      <p>从零开始学网络安全。原因很简单：想把这件事当成正经的本事来学，而不是东看一点西看一点。</p>
      <p>我的计划是先系统地入门，把基础打牢，再决定往哪个方向深入。安全这个领域方向很多，没基础就选方向，等于闭着眼睛挑路。</p>
      <p>学习的方法也定下来了：每天一小步，学一个概念，就动手验证一下。只看不动手，等于没学。</p>
      <p>这个博客就是学习路上的记录。写下来，一是逼自己把学到的东西讲清楚，二是以后回头看，能看到自己走了多远。</p>
